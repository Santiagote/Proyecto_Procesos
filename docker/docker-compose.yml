services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: sacarf
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Sacarf2026!
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - ../.env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
volumes:
  postgres_data:
  static_volume:
  media_volume:
